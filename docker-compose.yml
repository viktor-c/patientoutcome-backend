version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: patientoutcome-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - CORS_ORIGIN=http://localhost:3000
      - MONGO_URI=mongodb://patientmanager:1234Test@mongodb:27017/clinical-patientoutcome?authSource=admin
      - COMMON_RATE_LIMIT_MAX_REQUESTS=1000
      - COMMON_RATE_LIMIT_WINDOW_MS=900000
      - SESSION_SECRET=your-super-secret-session-key-change-this-in-production
    depends_on:
      - mongodb
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health-check', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:7.0
    container_name: patientoutcome-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=patientmanager
      - MONGO_INITDB_ROOT_PASSWORD=1234Test
      - MONGO_INITDB_DATABASE=clinical-patientoutcome
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
