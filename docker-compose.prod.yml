version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: patientoutcome-backend-prod
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      # These should be set via environment variables or secrets in production
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - MONGO_URI=mongodb://patientmanager:1234Test@mongodb:27017/clinical-patientoutcome?authSource=admin
      - COMMON_RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - COMMON_RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - mongodb
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health-check', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mongodb:
    image: mongo:7.0
    container_name: patientoutcome-mongodb-prod
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME:-patientmanager}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:-1234Test}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE:-clinical-patientoutcome}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
